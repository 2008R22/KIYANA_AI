<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KIYANA – AI Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#000; --surface:#0a0a0a; --surface2:#161616; --surface3:#222; --text:#f0f0f0; --dim:#666; --radius:20px; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }

  header { padding:20px 24px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--surface2); background:rgba(0,0,0,.9); backdrop-filter:blur(20px); flex-shrink:0; }
  .brand { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; letter-spacing:.12em; }
  .header-btns { display:flex; gap:10px; }

  .icon-btn { background:var(--surface2); border:none; color:var(--text); width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
  .icon-btn:active { transform:scale(.9); }
  .icon-btn svg { width:20px; height:20px; }

  #viewport { flex:1; overflow-y:auto; padding:24px 16px; display:flex; flex-direction:column; gap:18px; padding-bottom:20px; scroll-behavior:smooth; }

  .msg { max-width:80%; animation:fadeUp .35s ease-out forwards; }
  .msg.user { align-self:flex-end; }
  .msg.ai { align-self:flex-start; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .bubble { padding:14px 18px; border-radius:20px; font-size:.97rem; line-height:1.65; word-break:break-word; white-space:pre-wrap; }
  .msg.user .bubble { background:var(--surface3); border-bottom-right-radius:4px; }
  .msg.ai .bubble { background:var(--surface); border:1px solid var(--surface2); border-bottom-left-radius:4px; }

  .img-wrap { margin-top:12px; border-radius:12px; overflow:hidden; border:1px solid var(--surface2); position:relative; max-width:420px; }
  .img-wrap img { width:100%; display:block; }
  .dl-btn { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.1); color:#fff; width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .dl-btn svg { width:16px; height:16px; }

  .thinking { display:none; align-items:center; gap:8px; padding:4px 8px; font-size:.85rem; color:var(--dim); align-self:flex-start; }
  .dot { width:5px; height:5px; background:var(--dim); border-radius:50%; animation:pulse 1.4s infinite; }
  .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  .input-section { padding:12px 16px 20px; border-top:1px solid var(--surface2); flex-shrink:0; }
  .input-bar { max-width:800px; margin:0 auto; background:var(--surface); border:1px solid var(--surface2); border-radius:30px; padding:6px 10px; display:flex; align-items:center; gap:6px; }
  .action-btn { width:44px; height:44px; border-radius:50%; border:none; background:transparent; color:var(--dim); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .action-btn:active { background:var(--surface2); color:var(--text); }
  .action-btn svg { width:21px; height:21px; }
  #msgInput { flex:1; background:transparent; border:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:1rem; padding:10px 4px; max-height:120px; outline:none; resize:none; overflow-y:auto; }
  .send-btn { width:44px; height:44px; border-radius:50%; border:none; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .send-btn svg { width:20px; height:20px; }

  .img-preview { display:none; padding:8px 16px 0; gap:8px; align-items:center; }
  .img-preview img { width:48px; height:48px; object-fit:cover; border-radius:8px; border:1px solid #333; }
  .img-preview span { font-size:.85rem; color:var(--dim); }
  .img-preview button { margin-left:auto; background:none; border:none; color:var(--dim); cursor:pointer; font-size:1.2rem; }

  /* Call overlay */
  #callOverlay { position:fixed; inset:0; background:#000; z-index:1000; display:none; flex-direction:column; align-items:center; justify-content:space-around; padding:60px 24px; }
  .call-name { font-family:'Syne',sans-serif; font-size:1.8rem; font-weight:800; letter-spacing:.1em; text-align:center; }
  .call-status { color:var(--dim); letter-spacing:.15em; font-size:.9rem; text-align:center; margin-top:8px; }
  .call-avatar { position:relative; width:160px; height:160px; }
  .call-avatar-inner { width:160px; height:160px; border-radius:50%; background:var(--surface); border:1px solid var(--surface2); display:flex; align-items:center; justify-content:center; }
  .call-avatar-inner svg { width:60px; height:60px; }
  .pulse-ring { position:absolute; inset:-15px; border:2px solid #fff; border-radius:50%; animation:ring 2s infinite; }
  @keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.6);opacity:0}}
  .transcript { color:var(--dim); text-align:center; padding:0 20px; font-size:1rem; font-style:italic; max-width:320px; }
  .end-btn { width:72px; height:72px; border-radius:50%; background:#ff4444; border:none; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .end-btn svg { width:30px; height:30px; }

  /* Modals */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; z-index:2000; padding:20px; }
  .overlay.show { display:flex; }
  .modal { background:var(--surface); width:100%; max-width:420px; padding:32px; border-radius:28px; border:1px solid var(--surface2); max-height:90vh; overflow-y:auto; }
  .modal h3 { font-family:'Syne',sans-serif; font-size:1.3rem; font-weight:700; margin-bottom:20px; }
  .modal-btn { width:100%; height:52px; background:var(--surface2); border:1px solid var(--surface2); color:var(--text); border-radius:14px; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.95rem; margin-bottom:10px; }
  .modal-btn.ghost { background:var(--surface); }
  .about { margin-top:20px; padding-top:20px; border-top:1px solid var(--surface2); text-align:center; }
  .about p { color:var(--dim); font-size:.9rem; }
  .about strong { font-family:'Syne',sans-serif; display:block; margin:4px 0; font-size:1.05rem; }
  .about a { color:rgba(255,255,255,.5); font-size:.85rem; text-decoration:none; }

  .img-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-height:380px; overflow-y:auto; margin-bottom:16px; }
  .img-thumb { border-radius:10px; overflow:hidden; border:1px solid var(--surface2); position:relative; }
  .img-thumb img { width:100%; display:block; aspect-ratio:1; object-fit:cover; }
  .img-thumb p { padding:5px 8px; background:var(--surface); font-size:.75rem; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { color:var(--dim); text-align:center; padding:24px 0; }
</style>
</head>
<body>

  <div class="header-btns">

      <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>

<!-- Image History Modal -->
<div class="overlay" id="historyOverlay">
  <div class="modal">

      <h3 style="margin:0">Image History</h3>
      <button id="clearImgHistory" style="background:none;border:none;color:#555;font-size:.8rem;cursor:pointer">Clear all</button>

    <div class="img-grid" id="imgGrid"><p class="empty">No images generated yet.</p></div>

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
  const API = ''; // empty = same origin (localhost:3000)
  const CHAT_KEY = 'kiyana_chat';
  const IMG_KEY = 'kiyana_imgs';

  let messages = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]');
  let imgHistory = JSON.parse(localStorage.getItem(IMG_KEY) || '[]');
  let pendingBase64 = null;
  let isCalling = false;
  let recognition = null;

  const viewport = document.getElementById('viewport');
  const msgInput = document.getElementById('msgInput');
  const thinking = document.getElementById('thinking');
  const thinkLabel = document.getElementById('thinkLabel');
  const imgPreview = document.getElementById('imgPreview');
  const previewThumb = document.getElementById('previewThumb');

  function save() { localStorage.setItem(CHAT_KEY, JSON.stringify(messages)); }
  function saveImgs() { localStorage.setItem(IMG_KEY, JSON.stringify(imgHistory)); }

  function addMsg(role, text, imageUrl, isUserImg, fromHistory) {
    const entry = { role, text, imageUrl, isUserImg };
    if (!fromHistory) { messages.push(entry); save(); }

    const div = document.createElement('div');
    div.className = `msg ${role}`;
    let imgHtml = '';
    if (imageUrl) {
      imgHtml = `<div class="img-wrap">
        <img src="${imageUrl}" alt="${isUserImg ? 'Uploaded' : 'Generated'}">
        ${!isUserImg ? `<button class="dl-btn" onclick="dlImg('${imageUrl}')">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>` : ''}
      </div>`;
    }
    div.innerHTML = `<div class="bubble">${escHtml(text)}${imgHtml}</div>`;
    viewport.appendChild(div);
    viewport.scrollTop = viewport.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function dlImg(url) {
    try {
      if (url.startsWith('data:')) { const a=document.createElement('a'); a.href=url; a.download=`kiyana_${Date.now()}.jpg`; a.click(); return; }
      const r = await fetch(url); const blob = await r.blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `kiyana_${Date.now()}.jpg`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch(e) {}
  }

  function buildHistory() {
    return messages.filter(m => !m.isUserImg && !m.imageUrl).slice(-20).map(m => ({
      role: m.role === 'user' ? 'user' : 'assistant', content: m.text
    }));
  }

  async function sendChat(text, base64) {
    thinkLabel.textContent = 'Thinking';
    thinking.style.display = 'flex';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, imageBase64: base64 || undefined, history: base64 ? undefined : buildHistory() })
      });
      const data = await res.json();
      if (!res.ok || data.error) { addMsg('ai', 'Error: ' + (data.error || 'Something went wrong')); return null; }
      return data.content;
    } catch(e) { addMsg('ai', 'Connection error.'); return null; }
    finally { thinking.style.display = 'none'; }
  }

  async function onSend() {
    const text = msgInput.value.trim();
    if (!text && !pendingBase64) return;
    const b64 = pendingBase64;
    const imgSrc = b64 ? `data:image/jpeg;base64,${b64}` : null;
    addMsg('user', text || 'Analyzing image...', imgSrc, !!b64);
    msgInput.value = ''; msgInput.style.height = 'auto';
    pendingBase64 = null; imgPreview.style.display = 'none';
    const reply = await sendChat(text, b64);
    if (reply) { addMsg('ai', reply); speak(reply); }
  }

  async function onGenerate() {
    const prompt = msgInput.value.trim();
    if (!prompt) return;
    addMsg('user', 'Generate image: ' + prompt);
    msgInput.value = ''; msgInput.style.height = 'auto';
    thinkLabel.textContent = 'Painting'; thinking.style.display = 'flex';
    try {
      const res = await fetch(`${API}/api/generate-image`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      if (!res.ok || data.error) { addMsg('ai', 'Failed: ' + (data.error || 'Unknown')); return; }
      if (data.url) {
        addMsg('ai', 'Here is your generated image.', data.url);
        imgHistory.unshift({ url: data.url, prompt, ts: Date.now() }); saveImgs(); renderImgGrid();
      }
    } catch(e) { addMsg('ai', 'Connection error.'); }
    finally { thinking.style.display = 'none'; }
  }

  async function speak(text, onEnd) {
  if (!text) { if (onEnd) onEnd(); return; }
  // Stop recognition while speaking to prevent echo
  if (recognition) { try { recognition.abort(); } catch {} }
  try {
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!res.ok) throw new Error('TTS failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    document.getElementById('callStatus').textContent = 'SPEAKING';
    audio.onended = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    audio.onerror = () => { URL.revokeObjectURL(url); if (onEnd) onEnd(); };
    await audio.play();
  } catch {
    // Fallback to browser TTS if server TTS fails
    const u = new SpeechSynthesisUtterance(text); u.rate = 1.05;
    if (onEnd) u.onend = onEnd;
    window.speechSynthesis.speak(u);
  }
}
// Replace your entire call button handler:
document.getElementById('callBtn').onclick = () => {
  isCalling = true;
  document.getElementById('callOverlay').style.display = 'flex';

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('callStatus').textContent = 'NOT SUPPORTED'; return; }

  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  const listenLoop = () => {
    if (!isCalling) return;
    // Recreate recognition instance since abort() invalidates the old one
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    recognition.onresult = handleResult;
    recognition.onerror = (e) => {
      if (e.error !== 'aborted' && isCalling) setTimeout(listenLoop, 500);
    };
    recognition.onend = () => {};
    document.getElementById('callStatus').textContent = 'LISTENING';
    try { recognition.start(); } catch(err) { if (isCalling) setTimeout(listenLoop, 500); }
  };

  async function handleResult(e) {
    const said = e.results[0][0].transcript.trim();
    if (!said) { listenLoop(); return; }

    document.getElementById('transcript').textContent = `"${said}"`;
    document.getElementById('callStatus').textContent = 'THINKING';
    addMsg('user', said);

    let fullReply = '';
    try {
      const res = await fetch('/api/chat-stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: said, history: buildHistory() })
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      document.getElementById('callStatus').textContent = 'SPEAKING';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        fullReply += decoder.decode(value, { stream: true });
        document.getElementById('transcript').textContent = fullReply;
      }
    } catch (err) {
      fullReply = 'Sorry, I had trouble connecting.';
    }

    if (fullReply) {
      addMsg('ai', fullReply);
      speak(fullReply, () => { if (isCalling) listenLoop(); });
    } else if (isCalling) listenLoop();
  }

  recognition.onresult = handleResult;
  recognition.onerror = (e) => {
    if (e.error !== 'aborted' && isCalling) setTimeout(listenLoop, 500);
  };
  recognition.onend = () => {};

  // Greet first, then start listening after greeting finishes
  speak("Hey, it's Kiyana! What's up?", () => { if (isCalling) listenLoop(); });
};

document.getElementById('endCallBtn').onclick = () => {
  isCalling = false;
  document.getElementById('callOverlay').style.display = 'none';
  document.getElementById('callStatus').textContent = 'CONNECTING...';
  document.getElementById('transcript').textContent = '';

  if (recognition) {
    recognition.onresult = null;
    recognition.onerror = null;
    recognition.onend = null;
    try { recognition.abort(); } catch {}
    recognition = null;
  }

  window.speechSynthesis.cancel();
  document.querySelectorAll('audio').forEach(a => { a.pause(); a.src = ''; });
};
  // Settings
  document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsOverlay').classList.add('show');
  document.getElementById('closeSettings').onclick = () => document.getElementById('settingsOverlay').classList.remove('show');
  document.getElementById('clearChatBtn').onclick = () => {
    messages = []; save(); viewport.innerHTML = '';
    document.getElementById('settingsOverlay').classList.remove('show');
    addMsg('ai', 'Memory cleared.');
  };

  // Image history
  document.getElementById('historyBtn').onclick = () => { renderImgGrid(); document.getElementById('historyOverlay').classList.add('show'); };
