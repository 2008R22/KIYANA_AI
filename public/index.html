<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KIYANA – AI Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#000; --surface:#0a0a0a; --surface2:#161616; --surface3:#222;
  --text:#f0f0f0; --dim:#666; --accent:#fff;
  --sidebar-w:270px;
}

/* FIX #8: Use 100dvh so mobile keyboard push doesn't break layout */
body {
  background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif;
  height:100vh; height:100dvh;
  display:flex; overflow:hidden;
}
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:2px; }

/* ═══════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════ */
#sidebar {
  width:var(--sidebar-w); height:100vh; height:100dvh;
  background:var(--surface); border-right:1px solid var(--surface2);
  display:flex; flex-direction:column;
  position:fixed; left:0; top:0; z-index:300;
  transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
  will-change:transform;
  /* FIX #10: safe-area padding for iOS notch/home bar */
  padding-bottom:env(safe-area-inset-bottom);
}
#sidebar.open { transform:translateX(0); }

.sidebar-header {
  padding:24px 20px 16px;
  padding-top:max(24px, calc(env(safe-area-inset-top) + 12px));
  border-bottom:1px solid var(--surface2);
  display:flex; justify-content:space-between; align-items:center;
}
.sidebar-title { font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; letter-spacing:.1em; }
.sidebar-close { background:none; border:none; color:var(--dim); cursor:pointer; padding:4px; }
.sidebar-close svg { width:20px; height:20px; }

.sidebar-new {
  margin:12px 16px;
  background:var(--surface2); border:1px solid var(--surface3);
  color:var(--text); border-radius:14px; padding:12px 16px;
  display:flex; align-items:center; gap:10px;
  cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.9rem;
  transition:.15s;
}
.sidebar-new:active { background:var(--surface3); }
.sidebar-new svg { width:18px; height:18px; color:var(--dim); flex-shrink:0; }

.sidebar-sessions {
  flex:1; overflow-y:auto; padding:8px 10px;
  display:flex; flex-direction:column; gap:4px;
}

.session-item {
  padding:12px 14px; border-radius:12px; cursor:pointer;
  border:1px solid transparent; transition:.15s;
  position:relative;
}
.session-item:hover, .session-item:active { background:var(--surface2); }
.session-item.active { background:var(--surface2); border-color:var(--surface3); }
.session-name {
  font-size:.88rem; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; padding-right:28px; color:var(--text);
}
.session-meta { font-size:.74rem; color:var(--dim); margin-top:3px; }
.session-del {
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:#444; cursor:pointer;
  font-size:1.1rem; line-height:1; padding:4px;
  opacity:0; transition:.15s;
}
.session-item:hover .session-del { opacity:1; }
.session-del:active { color:#f0f0f0; }

.sidebar-empty { padding:32px 16px; text-align:center; color:var(--dim); font-size:.85rem; }

#sidebarMask {
  position:fixed; inset:0; background:rgba(0,0,0,.6);
  z-index:299; display:none;
}
#sidebarMask.show { display:block; }

/* ═══════════════════════════════════════════════════════
   MAIN LAYOUT
═══════════════════════════════════════════════════════ */
#main {
  flex:1; display:flex; flex-direction:column;
  height:100vh; height:100dvh; overflow:hidden;
  transition:margin-left .28s cubic-bezier(.4,0,.2,1);
}

header {
  padding:16px 20px;
  padding-top:max(16px, calc(env(safe-area-inset-top) + 8px));
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--surface2);
  background:rgba(0,0,0,.92); backdrop-filter:blur(20px);
  flex-shrink:0; position:relative; z-index:10;
}
.header-left { display:flex; align-items:center; gap:12px; }
.brand { font-family:'Syne',sans-serif; font-weight:800; font-size:1.3rem; letter-spacing:.12em; }
.header-right { display:flex; gap:8px; }

.icon-btn {
  background:var(--surface2); border:none; color:var(--text);
  width:42px; height:42px; border-radius:13px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.15s; flex-shrink:0;
}
.icon-btn:active { transform:scale(.9); background:var(--surface3); }
.icon-btn svg { width:19px; height:19px; }

#viewport {
  flex:1; overflow-y:auto; padding:20px 16px;
  display:flex; flex-direction:column; gap:16px;
  padding-bottom:16px; scroll-behavior:smooth;
}

/* ── Messages ─────────────────────────────────────────── */
.msg { max-width:82%; animation:fadeUp .3s ease-out forwards; }
.msg.user { align-self:flex-end; }
.msg.ai   { align-self:flex-start; }
@keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.bubble {
  padding:13px 17px; border-radius:20px;
  font-size:.95rem; line-height:1.65;
  word-break:break-word; white-space:pre-wrap;
}
.msg.user .bubble { background:var(--surface3); border-bottom-right-radius:4px; }
.msg.ai   .bubble { background:var(--surface); border:1px solid var(--surface2); border-bottom-left-radius:4px; }

.img-wrap { margin-top:10px; border-radius:12px; overflow:hidden; border:1px solid var(--surface2); position:relative; max-width:380px; }
.img-wrap img { width:100%; display:block; }
.dl-btn {
  position:absolute; top:8px; right:8px;
  background:rgba(0,0,0,.65); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.1); color:#fff;
  width:32px; height:32px; border-radius:8px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.dl-btn svg { width:14px; height:14px; }

.thinking {
  display:none; align-items:center; gap:8px;
  padding:4px 8px; font-size:.83rem; color:var(--dim); align-self:flex-start;
}
.dot { width:5px; height:5px; background:var(--dim); border-radius:50%; animation:pulse 1.4s infinite; }
.dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* ── Input ────────────────────────────────────────────── */
.input-section {
  padding:10px 14px 18px;
  padding-bottom:max(18px, calc(env(safe-area-inset-bottom) + 10px));
  border-top:1px solid var(--surface2); flex-shrink:0;
}
.input-bar {
  max-width:800px; margin:0 auto;
  background:var(--surface); border:1px solid var(--surface2);
  border-radius:28px; padding:5px 8px;
  display:flex; align-items:center; gap:4px;
}
.action-btn {
  width:42px; height:42px; border-radius:50%; border:none;
  background:transparent; color:var(--dim);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0;
}
.action-btn:active { background:var(--surface2); color:var(--text); }
.action-btn svg { width:20px; height:20px; }
#msgInput {
  flex:1; background:transparent; border:none; color:var(--text);
  font-family:'DM Sans',sans-serif; font-size:1rem;
  padding:10px 4px; max-height:120px; outline:none; resize:none; overflow-y:auto;
}
.send-btn {
  width:42px; height:42px; border-radius:50%; border:none;
  background:#fff; color:#000;
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
}
.send-btn svg { width:19px; height:19px; }

.img-preview { display:none; padding:8px 14px 0; gap:8px; align-items:center; }
.img-preview img { width:46px; height:46px; object-fit:cover; border-radius:8px; border:1px solid #333; }
.img-preview span { font-size:.83rem; color:var(--dim); }
.img-preview button { margin-left:auto; background:none; border:none; color:var(--dim); cursor:pointer; font-size:1.2rem; }

/* ═══════════════════════════════════════════════════════
   MODALS / OVERLAYS
═══════════════════════════════════════════════════════ */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.88);
  display:none; align-items:center; justify-content:center;
  z-index:2000; padding:20px;
}
.overlay.show { display:flex; }
.modal {
  background:var(--surface); width:100%; max-width:400px;
  padding:30px; border-radius:26px; border:1px solid var(--surface2);
  max-height:90vh; overflow-y:auto;
}
.modal h3 { font-family:'Syne',sans-serif; font-size:1.2rem; font-weight:700; margin-bottom:18px; }
.modal-btn {
  width:100%; height:50px; background:var(--surface2); border:1px solid var(--surface2);
  color:var(--text); border-radius:13px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.93rem; margin-bottom:10px;
}
.modal-btn.ghost { background:var(--surface); }
.about { margin-top:18px; padding-top:18px; border-top:1px solid var(--surface2); text-align:center; }
.about p { color:var(--dim); font-size:.88rem; }
.about strong { font-family:'Syne',sans-serif; display:block; margin:4px 0; font-size:1rem; }

.setting-row { display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--surface2); }
.setting-row:last-child { border-bottom:none; }
.setting-label { font-size:.93rem; }
.setting-sub { font-size:.76rem; color:var(--dim); margin-top:2px; }
.toggle { width:44px; height:26px; border-radius:13px; background:var(--surface3); border:none; cursor:pointer; position:relative; transition:.2s; flex-shrink:0; }
.toggle.on { background:#fff; }
.toggle::after { content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#000; top:3px; left:3px; transition:.2s; }
.toggle.on::after { left:21px; }

/* ═══════════════════════════════════════════════════════
   LOCK SCREEN
═══════════════════════════════════════════════════════ */
#lockScreen {
  position:fixed; inset:0; z-index:9999; background:#000;
  display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:28px;
}
#lockScreen.show { display:flex; }
.lock-icon { opacity:.15; }
.lock-icon svg { width:50px; height:50px; stroke:#fff; }
.lock-title { font-family:'Syne',sans-serif; font-size:1rem; letter-spacing:.15em; color:#333; }
.pin-dots { display:flex; gap:14px; }
.pin-dot { width:13px; height:13px; border-radius:50%; border:2px solid #333; background:transparent; transition:.15s; }
.pin-dot.filled { background:#fff; border-color:#fff; }
.pin-pad { display:grid; grid-template-columns:repeat(3,68px); grid-template-rows:repeat(4,68px); gap:10px; }
.pin-key { width:68px; height:68px; border-radius:50%; background:var(--surface2); border:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:1.25rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.1s; }
.pin-key:active { background:var(--surface3); transform:scale(.93); }
.pin-key.del { font-size:.95rem; color:var(--dim); }
.pin-error { color:#ff4444; font-size:.83rem; min-height:18px; text-align:center; animation:shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

.shake-hint {
  position:fixed; bottom:88px; left:50%; transform:translateX(-50%);
  background:var(--surface2); border:1px solid var(--surface3);
  border-radius:18px; padding:6px 14px; font-size:.76rem; color:var(--dim);
  pointer-events:none; opacity:0; transition:opacity .4s; z-index:100; white-space:nowrap;
}
.shake-hint.show { opacity:1; }

/* ═══════════════════════════════════════════════════════
   CALL SCREEN
═══════════════════════════════════════════════════════ */
#callScreen {
  position:fixed; inset:0; z-index:6000;
  background:linear-gradient(160deg,#0d0d0d 0%,#111 100%);
  display:none; flex-direction:column;
  align-items:center; justify-content:space-between;
  /* FIX #10: safe area for notch + home bar */
  padding:max(56px, calc(env(safe-area-inset-top) + 40px)) 28px max(48px, calc(env(safe-area-inset-bottom) + 32px));
}
#callScreen.show { display:flex; }

.call-top { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; }

.call-avatar-wrap { position:relative; width:120px; height:120px; }
.avatar-ring {
  position:absolute; inset:-8px; border-radius:50%;
  border:2px solid transparent; transition:.4s;
}
.avatar-ring.pulse {
  border-color:rgba(255,255,255,.2);
  animation:ringPulse 1.4s ease-in-out infinite;
}
@keyframes ringPulse {
  0%,100% { transform:scale(1); opacity:.6; }
  50%      { transform:scale(1.12); opacity:1; }
}
.call-avatar {
  width:120px; height:120px; border-radius:50%;
  background:linear-gradient(135deg,#1a1a1a,#2a2a2a);
  border:2px solid var(--surface3);
  display:flex; align-items:center; justify-content:center;
  font-family:'Syne',sans-serif; font-size:2.8rem; font-weight:800; color:#fff;
  transition:.3s;
}

.call-name { font-family:'Syne',sans-serif; font-size:1.7rem; font-weight:800; letter-spacing:.04em; }
.call-timer { font-size:.85rem; color:var(--dim); font-variant-numeric:tabular-nums; letter-spacing:.06em; }

.call-wave { display:flex; align-items:center; gap:3px; height:32px; }
.wave-bar {
  width:3px; border-radius:2px; background:#2a2a2a;
  transition:height .1s ease, background .3s;
  height:4px;
}
.call-wave.ai-speaking .wave-bar {
  background:#fff;
  animation:waveAnim .5s ease-in-out infinite alternate;
}
.wave-bar:nth-child(1){animation-delay:0s}
.wave-bar:nth-child(2){animation-delay:.07s}
.wave-bar:nth-child(3){animation-delay:.14s}
.wave-bar:nth-child(4){animation-delay:.21s}
.wave-bar:nth-child(5){animation-delay:.1s}
.wave-bar:nth-child(6){animation-delay:.04s}
.wave-bar:nth-child(7){animation-delay:.18s}
.wave-bar:nth-child(8){animation-delay:.08s}
.wave-bar:nth-child(9){animation-delay:.16s}
@keyframes waveAnim { from{height:3px} to{height:26px} }

.call-wave.user-speaking .wave-bar { background:#888; animation:waveAnim .4s ease-in-out infinite alternate; }

.call-card {
  width:100%; max-width:360px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:20px; padding:16px 20px;
  min-height:70px; display:flex; align-items:center; justify-content:center;
}
.call-card p {
  font-size:.92rem; line-height:1.5; color:rgba(255,255,255,.75);
  text-align:center; transition:.2s;
}

.call-status-badge {
  font-size:.78rem; letter-spacing:.1em; color:var(--dim);
  text-transform:uppercase;
}

.call-controls { display:flex; gap:20px; align-items:center; }

.call-btn {
  width:62px; height:62px; border-radius:50%; border:none;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.15s; flex-shrink:0;
}
.call-btn svg { width:24px; height:24px; }
.call-btn:active { transform:scale(.9); }
.call-btn.mute   { background:var(--surface2); color:var(--text); }
.call-btn.mute.on { background:#fff; color:#000; }
.call-btn.speaker { background:var(--surface2); color:var(--text); }
.call-btn.speaker.on { background:#fff; color:#000; }
.call-btn.end { background:#ff3b30; color:#fff; }
</style>
</head>
<body>

<!-- ══ SIDEBAR ══════════════════════════════════════════════════════════════ -->
<div id="sidebarMask"></div>
<div id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">CHATS</span>
    <button class="sidebar-close" id="sidebarClose">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <button class="sidebar-new" id="newChatBtn">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New Chat
  </button>
  <div class="sidebar-sessions" id="sidebarSessions"></div>
</div>

<!-- ══ MAIN ═════════════════════════════════════════════════════════════════ -->
<div id="main">
  <header>
    <div class="header-left">
      <button class="icon-btn" id="sidebarToggle" title="Chats">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand">KIYANA</div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="callBtn" title="Voice Call">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.38 2 2 0 0 1 3.6 1.21h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.77a16 16 0 0 0 6.29 6.29l1.62-1.62a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="viewport"></div>

  <div class="thinking" id="thinking">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <span id="thinkLabel">Thinking</span>
  </div>

  <div class="img-preview" id="imgPreview">
    <img id="previewThumb" src="" alt="">
    <span>Image attached</span>
    <button id="clearImg">×</button>
  </div>

  <div class="input-section">
    <div class="input-bar">
      <button class="action-btn" id="analyzeBtn" title="Analyze Image">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </button>
      <button class="action-btn" id="genBtn" title="Generate Image">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z"/><path d="M19 14l.75 2.25L22 17l-2.25.75L19 20l-.75-2.25L16 17l2.25-.75z"/></svg>
      </button>
      <textarea id="msgInput" rows="1" placeholder="Say something…"></textarea>
      <button class="send-btn" id="sendBtn">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="shake-hint" id="shakeHint">Shake to lock</div>

<!-- ══ LOCK SCREEN ═══════════════════════════════════════════════════════════ -->
<div id="lockScreen">
  <div class="lock-icon">
    <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <div class="lock-title">KIYANA IS LOCKED</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad" id="pinPad"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════════════════════ */
const API = 'https://kiyana-ai.vercel.app';

const SESSIONS_KEY  = 'kiyana_sessions_v2';
const IMG_KEY       = 'kiyana_imgs';
const PIN_KEY       = 'kiyana_pin';
const LOCK_KEY      = 'kiyana_lock_enabled';
const LASTOPEN_KEY  = 'kiyana_last_open';
const ACTIVE_ID_KEY = 'kiyana_active_id';

/* ═══════════════════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════════════════ */
let sessions     = JSON.parse(localStorage.getItem(SESSIONS_KEY) || '[]');
let imgHistory   = JSON.parse(localStorage.getItem(IMG_KEY)      || '[]');
let currentId    = null;
let messages     = [];
let pendingBase64= null;

const viewport     = document.getElementById('viewport');
const msgInput     = document.getElementById('msgInput');
const thinking     = document.getElementById('thinking');
const thinkLabel   = document.getElementById('thinkLabel');
const imgPreview   = document.getElementById('imgPreview');
const previewThumb = document.getElementById('previewThumb');

/* ═══════════════════════════════════════════════════════════════════════════
   SESSION HELPERS
═══════════════════════════════════════════════════════════════════════════ */
function saveSessions(){ localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }
function saveImgs()    { localStorage.setItem(IMG_KEY, JSON.stringify(imgHistory.slice(0,40))); }
function getSession(id){ return sessions.find(s => s.id === id); }

function persistCurrentMessages(){
  if(!currentId) return;
  const s = getSession(currentId);
  if(s){ s.messages = JSON.parse(JSON.stringify(messages)); s.ts = Date.now(); saveSessions(); }
}

function createNewSession(){
  const id  = Date.now();
  const s   = { id, name:'New Chat', ts:id, messages:[] };
  sessions.unshift(s);
  saveSessions();
  currentId = id;
  messages  = [];
  viewport.innerHTML = '';
  renderMsg('ai', buildContextualGreeting());
  persistCurrentMessages();
  renderSidebar();
}

/* FIX #12: Only auto-name once, on the very first user→AI exchange.
   Previously fired on every single AI reply — wasted API calls. */
async function autoNameSession(id){
  const s = getSession(id);
  if(!s || s.name !== 'New Chat') return;
  if(messages.filter(m => m.role === 'user').length !== 1) return;
  try{
    const res = await fetch(`${API}/api/name-chat`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ messages: messages.slice(0,4).map(m=>({role:m.role,content:m.text})) })
    });
    const data = await res.json();
    if(data.name && s){ s.name = data.name; saveSessions(); renderSidebar(); }
  }catch(e){}
}

function loadSession(id) {
  if (id === currentId) { closeSidebar(); return; }
  persistCurrentMessages();
  const s = getSession(id);
  if (!s) return;
  currentId = id;
  messages  = JSON.parse(JSON.stringify(s.messages));
  viewport.innerHTML = '';
  messages.forEach(m => renderMsg(m.role, m.text, m.imageUrl, m.isUserImg));
  viewport.scrollTop = viewport.scrollHeight;
  renderSidebar();
  closeSidebar();
}

function deleteSession(e, id) {
  e.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  saveSessions();
  if (id === currentId) {
    if (sessions.length) {
      loadSession(sessions[0].id);
    } else {
      currentId = null; messages = [];
      viewport.innerHTML = '';
      createNewSession();
    }
  } else {
    renderSidebar();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   SIDEBAR RENDER
═══════════════════════════════════════════════════════════════════════════ */
function renderSidebar() {
  const el = document.getElementById('sidebarSessions');
  if (!sessions.length) {
    el.innerHTML = '<div class="sidebar-empty">No chats yet</div>';
    return;
  }
  el.innerHTML = sessions.map(s => `
    <div class="session-item${s.id === currentId ? ' active' : ''}" onclick="loadSession(${s.id})">
      <div class="session-name">${escHtml(s.name)}</div>
      <div class="session-meta">${formatDate(s.ts)}</div>
      <button class="session-del" onclick="deleteSession(event,${s.id})">×</button>
    </div>
  `).join('');
}

function openSidebar()  {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarMask').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarMask').classList.remove('show');
}

document.getElementById('sidebarToggle').onclick = openSidebar;
document.getElementById('sidebarClose').onclick  = closeSidebar;
document.getElementById('sidebarMask').onclick   = closeSidebar;
document.getElementById('newChatBtn').onclick    = () => { createNewSession(); closeSidebar(); };

/* ═══════════════════════════════════════════════════════════════════════════
   CONTEXTUAL GREETING
═══════════════════════════════════════════════════════════════════════════ */
function buildContextualGreeting() {
  const hour = new Date().getHours();
  const lastOpen  = parseInt(localStorage.getItem(LASTOPEN_KEY) || '0');
  const gapHours  = (Date.now() - lastOpen) / 3600000;
  const gapDays   = gapHours / 24;
  localStorage.setItem(LASTOPEN_KEY, Date.now().toString());
  const tg = hour<5?"It's pretty late…":hour<12?"Good morning!":hour<17?"Hey, good afternoon.":hour<21?"Good evening!":"Up late tonight?";
  if (!lastOpen) return "Hey! I'm Kiyana. Nice to meet you 😊";
  if (gapDays>=7)  return `${tg} It's been over a week — I missed you.`;
  if (gapDays>=2)  return `${tg} You've been gone ${Math.floor(gapDays)} days. Everything good?`;
  if (gapHours>=20)return `${tg} Slept okay? What's on your mind?`;
  if (gapHours>=6) return `${tg} Welcome back. What's up?`;
  if (gapHours>=1) return "Hey, you're back. Miss me already?";
  return ["Back so soon? I like it 😏","Forgot something?","Couldn't stay away, huh?","Already back — what's up?"][Math.floor(Math.random()*4)];
}

/* ═══════════════════════════════════════════════════════════════════════════
   SHAKE TO LOCK
   FIX #11: iOS 13+ requires DeviceMotionEvent.requestPermission() on a
            user gesture. We attach the listener lazily when permission is
            granted, instead of at page load (where it silently never fires).
═══════════════════════════════════════════════════════════════════════════ */
let lockEnabled=localStorage.getItem(LOCK_KEY)==='true', storedPin=localStorage.getItem(PIN_KEY)||'';
let isLocked=false,pinEntry='',setupEntry='',setupPhase=0,setupFirst='';
let lastX=0,lastY=0,lastZ=0,shakeTs=0;

function attachShakeListener(){
  window.addEventListener('devicemotion',e=>{
    if(!lockEnabled||isLocked) return;
    const {x,y,z}=e.accelerationIncludingGravity||{};
    if(x==null) return;
    const delta=Math.abs(x-lastX)+Math.abs(y-lastY)+Math.abs(z-lastZ);
    lastX=x;lastY=y;lastZ=z;
    if(delta>18&&Date.now()-shakeTs>2000){shakeTs=Date.now();triggerLock();}
  });
}

// Attach immediately on non-iOS; defer to permission request on iOS 13+
if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
  window._needsMotionPermission = true;
} else {
  attachShakeListener();
  window._needsMotionPermission = false;
}

function showShakeHint(){const h=document.getElementById('shakeHint');h.classList.add('show');setTimeout(()=>h.classList.remove('show'),2500);}
function triggerLock(){if(!storedPin)return;isLocked=true;pinEntry='';updatePinDots('pinDots',0);document.getElementById('pinError').textContent='';document.getElementById('lockScreen').classList.add('show');}
function tryUnlock(d){pinEntry+=d;updatePinDots('pinDots',pinEntry.length);if(pinEntry.length===4){if(pinEntry===storedPin){isLocked=false;document.getElementById('lockScreen').classList.remove('show');pinEntry='';}else{document.getElementById('pinError').textContent='Wrong PIN';setTimeout(()=>{pinEntry='';updatePinDots('pinDots',0);document.getElementById('pinError').textContent='';},700);}}}
function updatePinDots(cid,n){for(let i=0;i<4;i++)document.getElementById(cid==='pinDots'?`d${i}`:`sd${i}`).classList.toggle('filled',i<n);}
function buildPinPad(pid,onD,onDel){const p=document.getElementById(pid);p.innerHTML='';[1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(k=>{const b=document.createElement('button');b.className='pin-key'+(k==='⌫'?' del':'');b.textContent=k;if(k!=='')b.onclick=()=>k==='⌫'?onDel():onD(String(k));else b.style.background='transparent';p.appendChild(b);});}
buildPinPad('pinPad',d=>tryUnlock(d),()=>{pinEntry=pinEntry.slice(0,-1);updatePinDots('pinDots',pinEntry.length);});
buildPinPad('setupPad',d=>{
  if(setupEntry.length>=4)return;
  setupEntry+=d;updatePinDots('setupDots',setupEntry.length);
  if(setupEntry.length===4){
    if(setupPhase===0){setupFirst=setupEntry;setupEntry='';setupPhase=1;document.getElementById('setupError').textContent='Confirm your PIN';updatePinDots('setupDots',0);}
    else{
      if(setupEntry===setupFirst){storedPin=setupEntry;localStorage.setItem(PIN_KEY,storedPin);lockEnabled=true;localStorage.setItem(LOCK_KEY,'true');updateLockUI();document.getElementById('pinSetupOverlay').classList.remove('show');setupEntry='';setupPhase=0;setupFirst='';showShakeHint();}
      else{document.getElementById('setupError').textContent="PINs don't match";setupEntry='';setupPhase=0;setupFirst='';updatePinDots('setupDots',0);}
    }
  }
},()=>{setupEntry=setupEntry.slice(0,-1);updatePinDots('setupDots',setupEntry.length);});

function updateLockUI(){const t=document.getElementById('lockToggle'),s=document.getElementById('lockSub');t.classList.toggle('on',lockEnabled);s.textContent=lockEnabled?'Shake phone to lock · PIN is set':'Shake phone to lock chat with PIN';}
updateLockUI();

document.getElementById('lockToggle').onclick = async () => {
  if(!lockEnabled){
    // FIX #11: Request motion permission on iOS before proceeding
    if(window._needsMotionPermission){
      try{
        const perm = await DeviceMotionEvent.requestPermission();
        if(perm === 'granted'){
          attachShakeListener();
          window._needsMotionPermission = false;
        } else {
          alert('Motion permission denied. Shake-to-lock requires motion access.');
          return;
        }
      }catch(e){ console.warn('Motion permission error', e); }
    }
    setupEntry='';setupPhase=0;setupFirst='';updatePinDots('setupDots',0);
    document.getElementById('setupError').textContent='Enter a 4-digit PIN';
    document.getElementById('pinSetupOverlay').classList.add('show');
    document.getElementById('settingsOverlay').classList.remove('show');
  } else {
    lockEnabled=false;storedPin='';localStorage.removeItem(PIN_KEY);localStorage.setItem(LOCK_KEY,'false');updateLockUI();
  }
};
document.getElementById('cancelPinSetup').onclick=()=>{document.getElementById('pinSetupOverlay').classList.remove('show');setupEntry='';setupPhase=0;};

/* ═══════════════════════════════════════════════════════════════════════════
   RENDER HELPERS
   FIX #14: Download buttons use a keyed lookup map instead of embedding
             base64 strings inside onclick attributes — avoids memory bloat
             and attribute-escaping issues with large data URIs.
═══════════════════════════════════════════════════════════════════════════ */
const _dlUrlMap = {};

function renderMsg(role, text, imageUrl, isUserImg){
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  // Build the bubble. Use a placeholder span for text so we can set via
  // textContent (safe against XSS) rather than innerHTML injection.
  let imgHtml = '';
  if(imageUrl){
    const safeUrl = imageUrl.startsWith('data:') ? imageUrl : escHtml(imageUrl);
    if(!isUserImg){
      const dlKey = '_dl_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      _dlUrlMap[dlKey] = imageUrl;
      imgHtml = `<div class="img-wrap">
        <img src="${safeUrl}" alt="" loading="lazy">
        <button class="dl-btn" data-dlkey="${dlKey}">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
      </div>`;
    } else {
      imgHtml = `<div class="img-wrap"><img src="${safeUrl}" alt="" loading="lazy"></div>`;
    }
  }

  div.innerHTML = `<div class="bubble"><span class="bubble-text"></span>${imgHtml}</div>`;
  div.querySelector('.bubble-text').textContent = text;
  viewport.appendChild(div);
  viewport.scrollTop = viewport.scrollHeight;
}

// FIX #14: Delegated click handler — one listener handles all download buttons
viewport.addEventListener('click', e => {
  const btn = e.target.closest('.dl-btn');
  if(!btn) return;
  const url = _dlUrlMap[btn.dataset.dlkey];
  if(url) dlImg(url);
});

function addMsg(role, text, imageUrl, isUserImg){
  const entry = { role, text, imageUrl, isUserImg };
  messages.push(entry);
  renderMsg(role, text, imageUrl, isUserImg);
  persistCurrentMessages();
  if(role === 'assistant') autoNameSession(currentId);
}

function escHtml(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function formatDate(ts){
  const d=new Date(ts),dd=Math.floor((Date.now()-d)/86400000);
  if(dd===0)return'Today · '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if(dd===1)return'Yesterday';
  if(dd<7)return d.toLocaleDateString([],{weekday:'long'});
  return d.toLocaleDateString([],{day:'numeric',month:'short'});
}

async function dlImg(url){
  try{
    if(url.startsWith('data:')){const a=document.createElement('a');a.href=url;a.download=`kiyana_${Date.now()}.jpg`;a.click();return;}
    const r=await fetch(url);const blob=await r.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`kiyana_${Date.now()}.jpg`;document.body.appendChild(a);a.click();document.body.removeChild(a);
  }catch(e){}
}

/* FIX #13: Include ALL messages in context history, not just text-only ones.
   Previously, messages after an image were silently dropped from context,
   breaking conversation continuity after any image interaction. */
function buildHistory(){
  return messages.slice(-20)
    .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text || '' }))
    .filter(m => m.content);
}

/* ═══════════════════════════════════════════════════════════════════════════
   CHAT API
═══════════════════════════════════════════════════════════════════════════ */
async function sendChat(text, base64){
  thinkLabel.textContent='Thinking'; thinking.style.display='flex';
  try{
    const res=await fetch(`${API}/api/chat`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text, imageBase64:base64||undefined, history:base64?undefined:buildHistory()})
    });
    const data=await res.json();
    if(!res.ok||data.error){addMsg('ai','Error: '+(data.error||'Something went wrong'));return null;}
    return data.content;
  }catch(e){addMsg('ai','Connection error: '+e.message);return null;}
  finally{thinking.style.display='none';}
}

async function onSend(){
  const text=msgInput.value.trim(); if(!text&&!pendingBase64)return;
  const b64=pendingBase64; const imgSrc=b64?`data:image/jpeg;base64,${b64}`:null;
  addMsg('user', text||'Analyzing image…', imgSrc, !!b64);
  msgInput.value='';
  // FIX #9: Defer height reset to next frame so layout has settled
  requestAnimationFrame(() => { msgInput.style.height='auto'; });
  pendingBase64=null; imgPreview.style.display='none';
  const reply=await sendChat(text,b64);
  if(reply) addMsg('ai', reply);
}

async function onGenerate(){
  const prompt=msgInput.value.trim(); if(!prompt)return;
  addMsg('user','Generate image: '+prompt);
  msgInput.value='';
  requestAnimationFrame(() => { msgInput.style.height='auto'; }); // FIX #9
  thinkLabel.textContent='Painting'; thinking.style.display='flex';
  try{
    const res=await fetch(`${API}/api/generate-image`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const data=await res.json();
    if(!res.ok||data.error){addMsg('ai','Failed: '+(data.error||'Unknown'));return;}
    if(data.url){addMsg('ai','Here is your generated image.',data.url);imgHistory.unshift({url:data.url,prompt,ts:Date.now()});saveImgs();}
  }catch(e){addMsg('ai','Connection error: '+e.message);}
  finally{thinking.style.display='none';}
}

/* ═══════════════════════════════════════════════════════════════════════════
   LIVE CALL — VAD + TTS
═══════════════════════════════════════════════════════════════════════════ */
let callActive    = false;
let callHistory   = [];
let speakerOn     = true;
let isProcessing  = false;
let currentAudio  = null;   // now a BufferSource node, not an Audio element
let callTimerInt  = null;
let callSeconds   = 0;

// VAD state
let micStream       = null;
let audioCtx        = null;
let analyser        = null;
let vadInterval     = null;
let mediaRecorder   = null;
let audioChunks     = [];
let isSpeaking      = false;
let silenceTimer    = null;
let speechStarted   = false;
let recordingActive = false; // FIX #7: prevent double-start

/* FIX #4: SPEECH_THRESHOLD lowered 18 → 6.
   RMS of 512-sample time-domain data (0–255 centred at 128) at normal
   speech levels sits in the 3–12 range. 18 was far too high for quiet
   speakers and missed most real speech.
   FIX #5: MIN_SPEECH_MS is now actually enforced in the VAD loop below. */
const SPEECH_THRESHOLD  = 6;
const SILENCE_MS        = 1200;
const MIN_SPEECH_MS     = 400;

const callScreen     = document.getElementById('callScreen');
const callTranscript = document.getElementById('callTranscript');
const callWave       = document.getElementById('callWave');
const callTimerEl    = document.getElementById('callTimer');
const callStatusEl   = document.getElementById('callStatusBadge');
const avatarRing     = document.getElementById('avatarRing');
const speakerBtn     = document.getElementById('speakerBtn');
const endCallBtn     = document.getElementById('endCallBtn');

function setStatus(txt){ callStatusEl.textContent = txt; }

function startCallTimer(){
  callSeconds=0; callTimerEl.textContent='00:00';
  callTimerInt=setInterval(()=>{
    callSeconds++;
    const m=String(Math.floor(callSeconds/60)).padStart(2,'0');
    const s=String(callSeconds%60).padStart(2,'0');
    callTimerEl.textContent=`${m}:${s}`;
  },1000);
}
function stopCallTimer(){ clearInterval(callTimerInt); callTimerInt=null; }

// ── Open call ────────────────────────────────────────────────────────────────
document.getElementById('callBtn').onclick = async () => {
  // FIX #1/#2: Create + resume AudioContext on user gesture (required by browsers)
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended'){
    await audioCtx.resume();
  }
  callScreen.classList.add('show');
  callActive=true; callHistory=[]; speakerOn=true;
  speakerBtn.classList.add('on');
  setStatus('Connecting…');
  callTranscript.textContent='Starting call…';
  startCallTimer();
  await startMic();
};

// ── End call ─────────────────────────────────────────────────────────────────
endCallBtn.onclick = () => { endCall(); };

function endCall(){
  callActive=false;
  stopMic();
  // FIX #3: Stop the BufferSource node cleanly (no blob URL race condition)
  if(currentAudio){
    try{ currentAudio.stop(); }catch(e){}
    try{ currentAudio.disconnect(); }catch(e){}
    currentAudio = null;
  }
  isProcessing=false;
  stopCallTimer();
  callScreen.classList.remove('show');
  callWave.className='call-wave';
  avatarRing.className='avatar-ring';
}

// ── Speaker toggle ────────────────────────────────────────────────────────────
speakerBtn.onclick = () => {
  speakerOn=!speakerOn;
  speakerBtn.classList.toggle('on',speakerOn);
};

// ── Start mic + VAD ──────────────────────────────────────────────────────────
async function startMic(){
  try{
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    });

    if(audioCtx.state === 'suspended') await audioCtx.resume();

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    const source = audioCtx.createMediaStreamSource(micStream);
    source.connect(analyser);

    setStatus('Listening…');
    callTranscript.textContent = "Go ahead, I'm listening…";
    callWave.className='call-wave user-speaking';

    const dataArray = new Uint8Array(analyser.fftSize);
    let speechStartTs = 0; // FIX #5: track when speech began

    vadInterval = setInterval(()=>{
      if(!callActive || isProcessing) return;
      analyser.getByteTimeDomainData(dataArray);

      let sum=0;
      for(let i=0;i<dataArray.length;i++){
        const v=(dataArray[i]-128)/128;
        sum+=v*v;
      }
      const rms = Math.sqrt(sum/dataArray.length)*100;

      if(rms > SPEECH_THRESHOLD){
        clearTimeout(silenceTimer); silenceTimer=null;
        if(!isSpeaking){
          isSpeaking=true;
          speechStarted=true;
          speechStartTs = Date.now();
          startRecording();
        }
      } else {
        if(isSpeaking && !silenceTimer){
          silenceTimer=setTimeout(()=>{
            isSpeaking=false;
            silenceTimer=null;
            if(speechStarted){
              // FIX #5: Enforce minimum speech duration — discard short noise bursts
              if((Date.now() - speechStartTs) >= MIN_SPEECH_MS){
                stopRecordingAndSend();
              } else {
                speechStarted=false;
                if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
                audioChunks=[];
                recordingActive=false;
              }
            }
          }, SILENCE_MS);
        }
      }
    }, 80);

  }catch(err){
    callTranscript.textContent='Mic access denied.';
    setStatus('Error');
  }
}

function stopMic(){
  clearInterval(vadInterval); vadInterval=null;
  clearTimeout(silenceTimer); silenceTimer=null;
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  isSpeaking=false; speechStarted=false; audioChunks=[];
  recordingActive=false;
}

// ── Recording ────────────────────────────────────────────────────────────────
function startRecording(){
  // FIX #6/#7: Guard against double-start
  if(!micStream || recordingActive) return;
  recordingActive=true;
  audioChunks=[]; // FIX #7: Clear at start so previous utterance chunks don't leak
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
  try{
    mediaRecorder = new MediaRecorder(micStream, {mimeType});
    mediaRecorder.ondataavailable = e => { if(e.data && e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => { recordingActive=false; };
    mediaRecorder.start(100);
    callWave.className='call-wave user-speaking';
  }catch(e){
    console.error('MediaRecorder error',e);
    recordingActive=false;
  }
}

function stopRecordingAndSend(){
  speechStarted=false;
  // FIX #6: Only call stop() if recorder is actually active
  if(!mediaRecorder || mediaRecorder.state==='inactive'){
    recordingActive=false;
    return;
  }
  mediaRecorder.onstop = () => { recordingActive=false; processAudio(); };
  mediaRecorder.stop();
}

// ── Process: STT → Groq → TTS ────────────────────────────────────────────────
async function processAudio(){
  if(!audioChunks.length || !callActive){ resumeListening(); return; }

  isProcessing=true;
  callWave.className='call-wave';
  setStatus('Transcribing…');
  callTranscript.textContent='…';

  try{
    const mimeType  = audioChunks[0]?.type || 'audio/webm';
    const audioBlob = new Blob(audioChunks, {type:mimeType});
    audioChunks=[];

    if(audioBlob.size < 800){ resumeListening(); isProcessing=false; return; }

    const sttRes = await fetch(`${API}/api/stt`,{
      method:'POST',
      headers:{'Content-Type':mimeType},
      body:audioBlob
    });
    const sttData    = await sttRes.json();
    const transcript = (sttData.transcript||'').trim();

    if(!transcript){ resumeListening(); isProcessing=false; return; }

    callTranscript.textContent='🗣 '+transcript;
    callHistory.push({role:'user', content:transcript});

    setStatus('Thinking…');
    const chatRes = await fetch(`${API}/api/chat`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:transcript, history:callHistory.slice(-12)})
    });
    const chatData = await chatRes.json();
    const reply = (chatData.content||'Sorry.').replace(/[*_~`#>]/g,'');
    callHistory.push({role:'assistant', content:reply});
    callTranscript.textContent='💬 '+reply;

    setStatus('Speaking…');
    avatarRing.classList.add('pulse');
    callWave.className='call-wave ai-speaking';

    await speakReply(reply);

    avatarRing.classList.remove('pulse');

  }catch(err){
    callTranscript.textContent='⚠️ Error';
  }finally{
    isProcessing=false;
    if(callActive) resumeListening();
  }
}

function resumeListening(){
  if(!callActive) return;
  callWave.className='call-wave user-speaking';
  setStatus('Listening…');
  callTranscript.textContent='Go ahead…';
  isSpeaking=false; speechStarted=false;
}

/* ── TTS Playback ────────────────────────────────────────────────────────────
   FIX #1: Route audio through AudioContext.decodeAudioData + BufferSource
            instead of `new Audio(url)`. On iOS Safari, a plain Audio element
            created after an AudioContext exists plays into a different pipeline
            and can be silenced by the system. Using AudioContext exclusively
            keeps everything on the same audio graph.

   FIX #2: Guard against null audioCtx in case speakReply is ever called
            outside the call flow.

   FIX #3: No blob URL is created, so the Android blob-URL race condition
            (revoking while still loading) is completely eliminated.
            decodeAudioData works directly on the ArrayBuffer.
*/
async function speakReply(text){
  return new Promise(async (resolve) => {
    if(!speakerOn) return resolve();

    // FIX #2: Ensure AudioContext exists and is running
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){
      try{ await audioCtx.resume(); }catch(e){}
    }

    try{
      const ttsRes = await fetch(`${API}/api/tts`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text})
      });
      if(!ttsRes.ok) throw new Error('TTS fail');

      // FIX #3: Decode directly from ArrayBuffer — no blob URL needed
      const arrayBuf    = await ttsRes.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuf);

      // Stop any currently-playing audio cleanly before starting new
      if(currentAudio){
        try{ currentAudio.stop(); }catch(e){}
        try{ currentAudio.disconnect(); }catch(e){}
        currentAudio = null;
      }

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      currentAudio = source; // store ref so endCall() can abort it

      source.onended = () => {
        source.disconnect();
        if(currentAudio === source) currentAudio = null;
        resolve();
      };

      source.start(0);

    }catch(e){
      console.error('speakReply error', e);
      resolve();
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   PERSIST ON HIDE
═══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') persistCurrentMessages(); });
window.addEventListener('pagehide', persistCurrentMessages);

/* ═══════════════════════════════════════════════════════════════════════════
   SETTINGS / EVENTS
═══════════════════════════════════════════════════════════════════════════ */
document.getElementById('settingsBtn').onclick    = ()=>document.getElementById('settingsOverlay').classList.add('show');
document.getElementById('closeSettings').onclick  = ()=>document.getElementById('settingsOverlay').classList.remove('show');
document.getElementById('settingsOverlay').onclick= e=>{if(e.target.id==='settingsOverlay')e.target.classList.remove('show');};
document.getElementById('pinSetupOverlay').onclick= e=>{if(e.target.id==='pinSetupOverlay'){e.target.classList.remove('show');setupEntry='';setupPhase=0;}};

document.getElementById('analyzeBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=f=>{pendingBase64=f.target.result.split(',')[1];previewThumb.src=f.target.result;imgPreview.style.display='flex';msgInput.focus();};
  reader.readAsDataURL(file); e.target.value='';
};
document.getElementById('clearImg').onclick=()=>{pendingBase64=null;imgPreview.style.display='none';};
document.getElementById('genBtn').onclick =onGenerate;
document.getElementById('sendBtn').onclick=onSend;
msgInput.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();onSend();}};
// FIX #9: height auto-resize without flicker
msgInput.oninput=function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,120)+'px';
};

/* ═══════════════════════════════════════════════════════════════════════════
   BOOT — restore last session or create new
═══════════════════════════════════════════════════════════════════════════ */
(function boot(){
  if(sessions.length){
    const s=sessions[0];
    currentId=s.id;
    messages=JSON.parse(JSON.stringify(s.messages));
    if(messages.length){
      messages.forEach(m=>renderMsg(m.role,m.text,m.imageUrl,m.isUserImg));
      viewport.scrollTop=viewport.scrollHeight;
    } else {
      renderMsg('ai',buildContextualGreeting());
      persistCurrentMessages();
    }
  } else {
    createNewSession();
  }
  renderSidebar();
})();
</script>
