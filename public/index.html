<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KIYANA – AI Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#000; --surface:#0a0a0a; --surface2:#161616; --surface3:#222; --text:#f0f0f0; --dim:#666; --radius:20px; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }

  header { padding:20px 24px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--surface2); background:rgba(0,0,0,.9); backdrop-filter:blur(20px); flex-shrink:0; position:relative; z-index:10; }
  .brand { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; letter-spacing:.12em; }
  .header-btns { display:flex; gap:10px; }

  .icon-btn { background:var(--surface2); border:none; color:var(--text); width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
  .icon-btn:active { transform:scale(.9); }
  .icon-btn svg { width:20px; height:20px; }

  #viewport { flex:1; overflow-y:auto; padding:24px 16px; display:flex; flex-direction:column; gap:18px; padding-bottom:20px; scroll-behavior:smooth; }

  .msg { max-width:80%; animation:fadeUp .35s ease-out forwards; }
  .msg.user { align-self:flex-end; }
  .msg.ai { align-self:flex-start; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .bubble { padding:14px 18px; border-radius:20px; font-size:.97rem; line-height:1.65; word-break:break-word; white-space:pre-wrap; }
  .msg.user .bubble { background:var(--surface3); border-bottom-right-radius:4px; }
  .msg.ai .bubble { background:var(--surface); border:1px solid var(--surface2); border-bottom-left-radius:4px; }

  .img-wrap { margin-top:12px; border-radius:12px; overflow:hidden; border:1px solid var(--surface2); position:relative; max-width:420px; }
  .img-wrap img { width:100%; display:block; }
  .dl-btn { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.1); color:#fff; width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .dl-btn svg { width:16px; height:16px; }

  .thinking { display:none; align-items:center; gap:8px; padding:4px 8px; font-size:.85rem; color:var(--dim); align-self:flex-start; }
  .dot { width:5px; height:5px; background:var(--dim); border-radius:50%; animation:pulse 1.4s infinite; }
  .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  .input-section { padding:12px 16px 20px; border-top:1px solid var(--surface2); flex-shrink:0; }
  .input-bar { max-width:800px; margin:0 auto; background:var(--surface); border:1px solid var(--surface2); border-radius:30px; padding:6px 10px; display:flex; align-items:center; gap:6px; }
  .action-btn { width:44px; height:44px; border-radius:50%; border:none; background:transparent; color:var(--dim); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .action-btn:active { background:var(--surface2); color:var(--text); }
  .action-btn svg { width:21px; height:21px; }
  #msgInput { flex:1; background:transparent; border:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:1rem; padding:10px 4px; max-height:120px; outline:none; resize:none; overflow-y:auto; }
  .send-btn { width:44px; height:44px; border-radius:50%; border:none; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .send-btn svg { width:20px; height:20px; }

  .img-preview { display:none; padding:8px 16px 0; gap:8px; align-items:center; }
  .img-preview img { width:48px; height:48px; object-fit:cover; border-radius:8px; border:1px solid #333; }
  .img-preview span { font-size:.85rem; color:var(--dim); }
  .img-preview button { margin-left:auto; background:none; border:none; color:var(--dim); cursor:pointer; font-size:1.2rem; }

  /* Modals */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; z-index:2000; padding:20px; }
  .overlay.show { display:flex; }
  .modal { background:var(--surface); width:100%; max-width:420px; padding:32px; border-radius:28px; border:1px solid var(--surface2); max-height:90vh; overflow-y:auto; }
  .modal h3 { font-family:'Syne',sans-serif; font-size:1.3rem; font-weight:700; margin-bottom:20px; }
  .modal-btn { width:100%; height:52px; background:var(--surface2); border:1px solid var(--surface2); color:var(--text); border-radius:14px; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.95rem; margin-bottom:10px; }
  .modal-btn.ghost { background:var(--surface); }
  .about { margin-top:20px; padding-top:20px; border-top:1px solid var(--surface2); text-align:center; }
  .about p { color:var(--dim); font-size:.9rem; }
  .about strong { font-family:'Syne',sans-serif; display:block; margin:4px 0; font-size:1.05rem; }

  /* Chat history list */
  .history-list { display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto; margin-bottom:16px; }
  .history-item { background:var(--surface2); border-radius:14px; padding:14px 16px; cursor:pointer; border:1px solid transparent; transition:.15s; position:relative; padding-right:40px; }
  .history-item:active { border-color:#444; }
  .history-item .h-title { font-size:.9rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
  .history-item .h-meta { font-size:.75rem; color:var(--dim); }
  .history-item .h-del { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#555; font-size:1.2rem; cursor:pointer; line-height:1; }
  .history-item .h-del:active { color:#f0f0f0; }
  .empty { color:var(--dim); text-align:center; padding:24px 0; font-size:.9rem; }

  /* ── LOCK SCREEN ────────────────────────────────────────────────────── */
  #lockScreen {
    position:fixed; inset:0; z-index:9999;
    background:#000;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:32px;
  }
  #lockScreen.show { display:flex; }
  .lock-icon { opacity:.18; }
  .lock-icon svg { width:52px; height:52px; stroke:#fff; }
  .lock-title { font-family:'Syne',sans-serif; font-size:1.1rem; letter-spacing:.15em; color:#333; }
  .pin-dots { display:flex; gap:16px; }
  .pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid #333; background:transparent; transition:.15s; }
  .pin-dot.filled { background:#fff; border-color:#fff; }
  .pin-pad { display:grid; grid-template-columns:repeat(3,72px); grid-template-rows:repeat(4,72px); gap:12px; }
  .pin-key { width:72px; height:72px; border-radius:50%; background:var(--surface2); border:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:1.3rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.1s; }
  .pin-key:active { background:var(--surface3); transform:scale(.93); }
  .pin-key.del { font-size:1rem; color:var(--dim); }
  .pin-error { color:#ff4444; font-size:.85rem; min-height:20px; text-align:center; animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* ── LOCK SETUP inside settings ─────────────────────────────────────── */
  .setting-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--surface2); }
  .setting-row:last-child { border-bottom:none; }
  .setting-label { font-size:.95rem; }
  .setting-sub { font-size:.78rem; color:var(--dim); margin-top:2px; }
  .toggle { width:44px; height:26px; border-radius:13px; background:var(--surface3); border:none; cursor:pointer; position:relative; transition:.2s; flex-shrink:0; }
  .toggle.on { background:#fff; }
  .toggle::after { content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#000; top:3px; left:3px; transition:.2s; }
  .toggle.on::after { left:21px; background:#000; }

  /* shake hint badge */
  .shake-hint { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--surface3); border-radius:20px; padding:6px 16px; font-size:.78rem; color:var(--dim); pointer-events:none; opacity:0; transition:opacity .4s; z-index:100; white-space:nowrap; }
  .shake-hint.show { opacity:1; }
</style>
</head>
<body>

<header>
  <div class="brand">KIYANA</div>
  <div class="header-btns">
    <button class="icon-btn" id="historyBtn" title="Chat History">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><path d="M3.05 11a9 9 0 1 0 .5-3"/><polyline points="1 4 3 6 5 4"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
</header>

<div id="viewport"></div>

<div class="thinking" id="thinking">
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <span id="thinkLabel">Thinking</span>
</div>

<div class="img-preview" id="imgPreview">
  <img id="previewThumb" src="" alt="preview">
  <span>Image attached</span>
  <button id="clearImg">×</button>
</div>

<div class="input-section">
  <div class="input-bar">
    <button class="action-btn" id="analyzeBtn" title="Analyze Image">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>
    </button>
    <button class="action-btn" id="genBtn" title="Generate Image">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z"/><path d="M19 14l.75 2.25L22 17l-2.25.75L19 20l-.75-2.25L16 17l2.25-.75z"/><path d="M5 17l.5 1.5L7 19l-1.5.5L5 21l-.5-1.5L3 19l1.5-.5z"/></svg>
    </button>
    <textarea id="msgInput" rows="1" placeholder="How can I help?"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<!-- Shake hint -->
<div class="shake-hint" id="shakeHint">Shake to lock</div>

<!-- ── LOCK SCREEN ──────────────────────────────────────────────────────── -->
<div id="lockScreen">
  <div class="lock-icon">
    <svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <div class="lock-title">KIYANA IS LOCKED</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad" id="pinPad"></div>
  <div class="pin-error" id="pinError"></div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>Settings</h3>

    <div class="setting-row">
      <div>
        <div class="setting-label">Shake to Lock</div>
        <div class="setting-sub" id="lockSub">Shake phone to lock chat with PIN</div>
      </div>
      <button class="toggle" id="lockToggle"></button>
    </div>

    <div style="margin-top:16px">
      <button class="modal-btn ghost" id="closeSettings">Close</button>
    </div>
    <div class="about">
      <p>Crafted by</p>
      <strong>San Tech</strong>
    </div>
  </div>
</div>

<!-- Chat History Modal -->
<div class="overlay" id="historyOverlay">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="margin:0">Chat History</h3>
      <button id="clearAllHistory" style="background:none;border:none;color:#555;font-size:.8rem;cursor:pointer">Clear all</button>
    </div>
    <div class="history-list" id="historyList"></div>
    <button class="modal-btn ghost" id="closeHistory">Close</button>
  </div>
</div>

<!-- PIN Setup Modal -->
<div class="overlay" id="pinSetupOverlay">
  <div class="modal" style="text-align:center">
    <h3>Set a PIN</h3>
    <p style="color:var(--dim);font-size:.9rem;margin-bottom:24px">Choose a 4-digit PIN to lock your chat.</p>
    <div class="pin-dots" style="justify-content:center;margin-bottom:20px" id="setupDots">
      <div class="pin-dot" id="sd0"></div><div class="pin-dot" id="sd1"></div>
      <div class="pin-dot" id="sd2"></div><div class="pin-dot" id="sd3"></div>
    </div>
    <div class="pin-pad" style="margin:0 auto 16px" id="setupPad"></div>
    <div class="pin-error" id="setupError"></div>
    <button class="modal-btn ghost" id="cancelPinSetup" style="margin-top:8px">Cancel</button>
  </div>
</div>

<script>
  // ─── CHANGE THIS to your deployed server URL ───────────────────────────────
  const API = 'https://kiyana-ai.vercel.app';
  // ──────────────────────────────────────────────────────────────────────────

  const SESSIONS_KEY = 'kiyana_sessions';
  const IMG_KEY      = 'kiyana_imgs';
  const PIN_KEY      = 'kiyana_pin';
  const LOCK_KEY     = 'kiyana_lock_enabled';
  const LASTOPEN_KEY = 'kiyana_last_open';

  let sessions      = JSON.parse(localStorage.getItem(SESSIONS_KEY) || '[]');
  let imgHistory    = JSON.parse(localStorage.getItem(IMG_KEY)      || '[]');
  let messages      = [];
  let pendingBase64 = null;

  const viewport     = document.getElementById('viewport');
  const msgInput     = document.getElementById('msgInput');
  const thinking     = document.getElementById('thinking');
  const thinkLabel   = document.getElementById('thinkLabel');
  const imgPreview   = document.getElementById('imgPreview');
  const previewThumb = document.getElementById('previewThumb');

  // ── Persist ────────────────────────────────────────────────────────────────
  function saveSessions() { localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }
  function saveImgs()     { localStorage.setItem(IMG_KEY,      JSON.stringify(imgHistory)); }

  function archiveCurrentChat() {
    if (!messages.some(m => m.role === 'user')) return;
    const firstUser = messages.find(m => m.role === 'user');
    sessions.unshift({
      id: Date.now(), ts: Date.now(),
      title: firstUser ? firstUser.text.slice(0, 60) : 'Chat',
      messages: JSON.parse(JSON.stringify(messages))
    });
    if (sessions.length > 50) sessions = sessions.slice(0, 50);
    saveSessions();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') archiveCurrentChat();
  });
  window.addEventListener('pagehide', archiveCurrentChat);

  // ══════════════════════════════════════════════════════════════════════════
  //  FEATURE 1 — CONTEXTUAL GREETING
  // ══════════════════════════════════════════════════════════════════════════
  function buildContextualGreeting() {
    const now        = new Date();
    const hour       = now.getHours();
    const lastOpen   = parseInt(localStorage.getItem(LASTOPEN_KEY) || '0');
    const gapMs      = Date.now() - lastOpen;
    const gapHours   = gapMs / 3600000;
    const gapDays    = gapMs / 86400000;

    // Store this open time
    localStorage.setItem(LASTOPEN_KEY, Date.now().toString());

    // Time of day
    const timeGreet = hour < 5  ? "It's pretty late…" :
                      hour < 12 ? "Good morning!" :
                      hour < 17 ? "Hey, good afternoon." :
                      hour < 21 ? "Good evening!" :
                                  "Up late tonight?";

    // Gap-based memory
    if (lastOpen === 0) {
      return "Hey! I'm Kiyana. Nice to meet you.";
    }
    if (gapDays >= 7) {
      return `${timeGreet} It's been over a week. I was starting to miss you.`;
    }
    if (gapDays >= 2) {
      const days = Math.floor(gapDays);
      return `${timeGreet} You've been gone ${days} days. Everything okay?`;
    }
    if (gapHours >= 20) {
      return `${timeGreet} Slept well? What's on your mind today?`;
    }
    if (gapHours >= 6) {
      return `${timeGreet} Welcome back. What's going on?`;
    }
    if (gapHours >= 1) {
      return `Hey, you're back. Miss me already?`;
    }
    // Less than an hour — quick return
    const quips = [
      "Back so soon? I like it.",
      "Forgot something?",
      "Couldn't stay away, huh?",
      "Already back — what's up?"
    ];
    return quips[Math.floor(Math.random() * quips.length)];
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  FEATURE 2 — SHAKE TO LOCK
  // ══════════════════════════════════════════════════════════════════════════
  let lockEnabled  = localStorage.getItem(LOCK_KEY) === 'true';
  let storedPin    = localStorage.getItem(PIN_KEY) || '';
  let isLocked     = false;
  let pinEntry     = '';
  let setupEntry   = '';
  let setupPhase   = 0; // 0=first entry 1=confirm
  let setupFirst   = '';

  // Shake detection
  let lastX=0, lastY=0, lastZ=0, shakeTs=0;
  const SHAKE_THRESHOLD = 18;
  const SHAKE_COOLDOWN  = 2000;

  function onMotion(e) {
    if (!lockEnabled || isLocked) return;
    const { x, y, z } = e.accelerationIncludingGravity || {};
    if (x==null) return;
    const delta = Math.abs(x-lastX) + Math.abs(y-lastY) + Math.abs(z-lastZ);
    lastX=x; lastY=y; lastZ=z;
    if (delta > SHAKE_THRESHOLD && Date.now() - shakeTs > SHAKE_COOLDOWN) {
      shakeTs = Date.now();
      triggerLock();
    }
  }
  window.addEventListener('devicemotion', onMotion);

  // Show shake hint briefly when lock is enabled
  function showShakeHint() {
    const hint = document.getElementById('shakeHint');
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 2500);
  }

  function triggerLock() {
    if (!storedPin) return; // can't lock without a PIN
    isLocked = true;
    pinEntry = '';
    updatePinDots('pinDots', 0);
    document.getElementById('pinError').textContent = '';
    document.getElementById('lockScreen').classList.add('show');
  }

  function tryUnlock(digit) {
    pinEntry += digit;
    updatePinDots('pinDots', pinEntry.length);
    if (pinEntry.length === 4) {
      if (pinEntry === storedPin) {
        isLocked = false;
        document.getElementById('lockScreen').classList.remove('show');
        pinEntry = '';
      } else {
        document.getElementById('pinError').textContent = 'Wrong PIN. Try again.';
        setTimeout(() => {
          pinEntry = '';
          updatePinDots('pinDots', 0);
          document.getElementById('pinError').textContent = '';
        }, 700);
      }
    }
  }

  function updatePinDots(containerId, filled) {
    for (let i = 0; i < 4; i++) {
      document.getElementById(containerId === 'pinDots' ? `d${i}` : `sd${i}`)
              .classList.toggle('filled', i < filled);
    }
  }

  function buildPinPad(padId, onDigit, onDel) {
    const pad = document.getElementById(padId);
    pad.innerHTML = '';
    [1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'pin-key' + (k==='⌫' ? ' del' : '');
      btn.textContent = k;
      if (k !== '') btn.onclick = () => k === '⌫' ? onDel() : onDigit(String(k));
      else btn.style.background = 'transparent';
      pad.appendChild(btn);
    });
  }

  // Lock pin pad
  buildPinPad('pinPad',
    d => tryUnlock(d),
    () => { pinEntry = pinEntry.slice(0,-1); updatePinDots('pinDots', pinEntry.length); }
  );

  // PIN Setup pad
  buildPinPad('setupPad',
    d => {
      if (setupEntry.length >= 4) return;
      setupEntry += d;
      updatePinDots('setupDots', setupEntry.length);
      if (setupEntry.length === 4) {
        if (setupPhase === 0) {
          setupFirst  = setupEntry;
          setupEntry  = '';
          setupPhase  = 1;
          document.getElementById('setupError').textContent = 'Confirm your PIN';
          updatePinDots('setupDots', 0);
        } else {
          if (setupEntry === setupFirst) {
            storedPin = setupEntry;
            localStorage.setItem(PIN_KEY, storedPin);
            lockEnabled = true;
            localStorage.setItem(LOCK_KEY, 'true');
            updateLockToggleUI();
            document.getElementById('pinSetupOverlay').classList.remove('show');
            setupEntry = ''; setupPhase = 0; setupFirst = '';
            showShakeHint();
          } else {
            document.getElementById('setupError').textContent = "PINs don't match. Start over.";
            setupEntry = ''; setupPhase = 0; setupFirst = '';
            updatePinDots('setupDots', 0);
          }
        }
      }
    },
    () => { setupEntry = setupEntry.slice(0,-1); updatePinDots('setupDots', setupEntry.length); }
  );

  // Toggle UI
  function updateLockToggleUI() {
    const t = document.getElementById('lockToggle');
    const s = document.getElementById('lockSub');
    t.classList.toggle('on', lockEnabled);
    s.textContent = lockEnabled ? 'Shake phone to lock · PIN is set' : 'Shake phone to lock chat with PIN';
  }
  updateLockToggleUI();

  document.getElementById('lockToggle').onclick = () => {
    if (!lockEnabled) {
      // Enable — open PIN setup
      setupEntry = ''; setupPhase = 0; setupFirst = '';
      updatePinDots('setupDots', 0);
      document.getElementById('setupError').textContent = 'Enter a 4-digit PIN';
      document.getElementById('pinSetupOverlay').classList.add('show');
      document.getElementById('settingsOverlay').classList.remove('show');
    } else {
      // Disable
      lockEnabled = false;
      storedPin   = '';
      localStorage.removeItem(PIN_KEY);
      localStorage.setItem(LOCK_KEY, 'false');
      updateLockToggleUI();
    }
  };

  document.getElementById('cancelPinSetup').onclick = () => {
    document.getElementById('pinSetupOverlay').classList.remove('show');
    setupEntry = ''; setupPhase = 0;
  };

  // ── Render helpers ─────────────────────────────────────────────────────────
  function addMsg(role, text, imageUrl, isUserImg, fromHistory) {
    const entry = { role, text, imageUrl, isUserImg };
    if (!fromHistory) messages.push(entry);
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    let imgHtml = '';
    if (imageUrl) {
      imgHtml = `<div class="img-wrap">
        <img src="${imageUrl}" alt="${isUserImg ? 'Uploaded' : 'Generated'}">
        ${!isUserImg ? `<button class="dl-btn" onclick="dlImg('${imageUrl}')">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>` : ''}
      </div>`;
    }
    div.innerHTML = `<div class="bubble">${escHtml(text)}${imgHtml}</div>`;
    viewport.appendChild(div);
    viewport.scrollTop = viewport.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const diffDays = Math.floor((Date.now() - d) / 86400000);
    if (diffDays === 0) return 'Today · ' + d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    if (diffDays === 1) return 'Yesterday';
    if (diffDays < 7)  return d.toLocaleDateString([], { weekday:'long' });
    return d.toLocaleDateString([], { day:'numeric', month:'short', year:'numeric' });
  }

  async function dlImg(url) {
    try {
      if (url.startsWith('data:')) {
        const a = document.createElement('a'); a.href = url; a.download = `kiyana_${Date.now()}.jpg`; a.click(); return;
      }
      const r = await fetch(url); const blob = await r.blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `kiyana_${Date.now()}.jpg`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch(e) {}
  }

  function buildHistory() {
    return messages.filter(m => !m.isUserImg && !m.imageUrl).slice(-20).map(m => ({
      role: m.role === 'user' ? 'user' : 'assistant', content: m.text
    }));
  }

  // ── API calls ──────────────────────────────────────────────────────────────
  async function sendChat(text, base64) {
    thinkLabel.textContent = 'Thinking';
    thinking.style.display = 'flex';
    try {
      const res = await fetch(`${API}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, imageBase64: base64 || undefined, history: base64 ? undefined : buildHistory() })
      });
      const data = await res.json();
      if (!res.ok || data.error) { addMsg('ai', 'Error: ' + (data.error || 'Something went wrong')); return null; }
      return data.content;
    } catch(e) { addMsg('ai', 'Connection error: ' + e.message); return null; }
    finally { thinking.style.display = 'none'; }
  }

  async function onSend() {
    const text = msgInput.value.trim();
    if (!text && !pendingBase64) return;
    const b64 = pendingBase64;
    const imgSrc = b64 ? `data:image/jpeg;base64,${b64}` : null;
    addMsg('user', text || 'Analyzing image...', imgSrc, !!b64);
    msgInput.value = ''; msgInput.style.height = 'auto';
    pendingBase64 = null; imgPreview.style.display = 'none';
    const reply = await sendChat(text, b64);
    if (reply) addMsg('ai', reply);
  }

  async function onGenerate() {
    const prompt = msgInput.value.trim();
    if (!prompt) return;
    addMsg('user', 'Generate image: ' + prompt);
    msgInput.value = ''; msgInput.style.height = 'auto';
    thinkLabel.textContent = 'Painting'; thinking.style.display = 'flex';
    try {
      const res = await fetch(`${API}/api/generate-image`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      if (!res.ok || data.error) { addMsg('ai', 'Failed: ' + (data.error || 'Unknown')); return; }
      if (data.url) {
        addMsg('ai', 'Here is your generated image.', data.url);
        imgHistory.unshift({ url: data.url, prompt, ts: Date.now() }); saveImgs();
      }
    } catch(e) { addMsg('ai', 'Connection error: ' + e.message); }
    finally { thinking.style.display = 'none'; }
  }

  // ── History modal ──────────────────────────────────────────────────────────
  function renderHistoryList() {
    const list = document.getElementById('historyList');
    if (!sessions.length) { list.innerHTML = '<p class="empty">No saved chats yet.</p>'; return; }
    list.innerHTML = sessions.map((s, i) => `
      <div class="history-item" onclick="loadSession(${i})">
        <div class="h-title">${escHtml(s.title)}</div>
        <div class="h-meta">${formatDate(s.ts)} &middot; ${s.messages.length} messages</div>
        <button class="h-del" onclick="deleteSession(event,${i})">×</button>
      </div>`).join('');
  }

  function loadSession(i) {
    archiveCurrentChat();
    messages = JSON.parse(JSON.stringify(sessions[i].messages));
    viewport.innerHTML = '';
    messages.forEach(m => addMsg(m.role, m.text, m.imageUrl, m.isUserImg, true));
    viewport.scrollTop = viewport.scrollHeight;
    document.getElementById('historyOverlay').classList.remove('show');
  }

  function deleteSession(e, i) {
    e.stopPropagation();
    sessions.splice(i, 1); saveSessions(); renderHistoryList();
  }

  // ── Event listeners ────────────────────────────────────────────────────────
  document.getElementById('settingsBtn').onclick   = () => document.getElementById('settingsOverlay').classList.add('show');
  document.getElementById('closeSettings').onclick  = () => document.getElementById('settingsOverlay').classList.remove('show');
  document.getElementById('settingsOverlay').onclick = (e) => { if (e.target.id==='settingsOverlay') e.target.classList.remove('show'); };

  document.getElementById('historyBtn').onclick = () => { renderHistoryList(); document.getElementById('historyOverlay').classList.add('show'); };
  document.getElementById('closeHistory').onclick    = () => document.getElementById('historyOverlay').classList.remove('show');
  document.getElementById('clearAllHistory').onclick = () => { sessions = []; saveSessions(); renderHistoryList(); };
  document.getElementById('historyOverlay').onclick  = (e) => { if (e.target.id==='historyOverlay') e.target.classList.remove('show'); };

  document.getElementById('pinSetupOverlay').onclick = (e) => { if (e.target.id==='pinSetupOverlay') { document.getElementById('pinSetupOverlay').classList.remove('show'); setupEntry=''; setupPhase=0; } };

  document.getElementById('analyzeBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (f) => {
      pendingBase64 = f.target.result.split(',')[1];
      previewThumb.src = f.target.result;
      imgPreview.style.display = 'flex';
      msgInput.focus();
    };
    reader.readAsDataURL(file); e.target.value = '';
  };
  document.getElementById('clearImg').onclick = () => { pendingBase64 = null; imgPreview.style.display = 'none'; };

  document.getElementById('genBtn').onclick  = onGenerate;
  document.getElementById('sendBtn').onclick = onSend;
  msgInput.onkeydown = (e) => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } };
  msgInput.oninput   = function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; };

  // ── Boot ───────────────────────────────────────────────────────────────────
  addMsg('ai', buildContextualGreeting());
</script>
</body>
</html>
